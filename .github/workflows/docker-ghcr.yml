name: Docker GHCR

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label or expression'
        required: false
        type: string
        default: ubuntu-latest
      context:
        description: 'Docker build context'
        required: false
        type: string
        default: .
      file:
        description: 'Optional Dockerfile path'
        required: false
        type: string
        default: ''
      image:
        description: 'Target image name (defaults to ghcr.io/<owner>/<repo>)'
        required: false
        type: string
        default: ''
      push:
        description: 'Whether to push the built image to GHCR'
        required: false
        type: boolean
        default: false
      guard-branch:
        description: 'If set when pushing, skip push unless this branch still points to github.sha'
        required: false
        type: string
        default: ''
      metadata-tags:
        description: 'Newline-delimited tags passed to docker/metadata-action'
        required: false
        type: string
        default: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix=,format=long
      max-parallelism:
        description: 'BuildKit worker max-parallelism'
        required: false
        type: number
        default: 2
      timeout-minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 45

jobs:
  docker:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = ${{ inputs.max-parallelism }}
      - name: Check current branch before publishing
        id: revision
        if: inputs.push && inputs.guard-branch != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          GUARD_BRANCH: ${{ inputs.guard-branch }}
        with:
          script: |
            const branch = process.env.GUARD_BRANCH;
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: `heads/${branch}` });
            const branchHead = data.object?.sha;
            if (typeof branchHead !== 'string' || !branchHead.trim()) {
              throw new Error(`Cannot verify current ${branch}; refusing to publish`);
            }
            core.setOutput('current', String(branchHead === context.sha));
      - name: Log in to GHCR
        if: inputs.push && (inputs.guard-branch == '' || steps.revision.outputs.current == 'true')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Derive image tags and labels
        id: meta
        if: inputs.push || inputs.image != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image || format('ghcr.io/{0}', github.repository) }}
          tags: ${{ inputs.metadata-tags }}
      - name: Build image (no push)
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push image
        if: inputs.push && (inputs.guard-branch == '' || steps.revision.outputs.current == 'true')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
